<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深度導聆</title>
<style>
  :root{
    --bg:#0d0c0f; --bg2:#14131a; --card:#1a1922; --line:#2a2833; --line2:#3a3747;
    --txt:#ece9f2; --dim:#9b95ab; --dim2:#6f6a7d;
    --accent:#fa4b6e; --accent2:#ffb26b; --gold:#e8c27a; --cyan:#7ad3e8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(1000px 560px at 82% -12%, rgba(250,75,110,.13), transparent 62%),
      radial-gradient(760px 520px at -5% 100%, rgba(120,110,255,.11), transparent 62%),
      var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.8; min-height:100vh;
  }
  a{color:inherit}
  .shell{max-width:1240px;margin:0 auto;padding:0 22px 110px;display:grid;
    grid-template-columns:200px minmax(0,1fr);gap:38px;align-items:start}
  @media(max-width:900px){ .shell{grid-template-columns:1fr;gap:0} }

  /* ---------- 側邊目錄 ---------- */
  nav.toc{position:sticky;top:22px;padding-top:34px}
  @media(max-width:900px){
    nav.toc{position:static;padding:16px 0 0;overflow-x:auto;white-space:nowrap;
      border-bottom:1px solid var(--line);margin-bottom:18px}
    nav.toc .tocTitle{display:none}
    nav.toc a{display:inline-block;margin:0 6px 10px 0}
  }
  .tocTitle{font-size:11px;letter-spacing:.24em;color:var(--dim2);text-transform:uppercase;margin-bottom:12px}
  nav.toc a{display:block;font-size:13px;color:var(--dim2);text-decoration:none;padding:6px 10px;
    border-radius:8px;border-left:2px solid transparent;transition:.16s}
  nav.toc a:hover{color:var(--txt);background:rgba(255,255,255,.04)}
  nav.toc a.on{color:var(--accent2);border-left-color:var(--accent);background:rgba(250,75,110,.07)}
  @media(max-width:900px){ nav.toc a{border-left:0;border-bottom:2px solid transparent}
    nav.toc a.on{border-left:0;border-bottom-color:var(--accent)} }

  main{padding-top:34px;min-width:0}

  /* ---------- HERO ---------- */
  .back{display:inline-block;font-size:12.5px;color:var(--dim2);text-decoration:none;margin-bottom:20px}
  .back:hover{color:var(--txt)}
  .hero{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start}
  .hart{width:250px;height:250px;flex:none;border-radius:14px;overflow:hidden;background:#211f2b;
    position:relative;box-shadow:0 22px 56px rgba(0,0,0,.6)}
  .hart img{width:100%;height:100%;object-fit:cover;display:block}
  .hart .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:800;color:rgba(255,255,255,.2)}
  .hmeta{flex:1;min-width:280px}
  .kicker{font-size:11px;letter-spacing:.28em;color:var(--dim2);text-transform:uppercase}
  .hmeta h1{font-size:38px;line-height:1.2;letter-spacing:-.02em;margin:9px 0 5px;font-weight:750}
  .hmeta .who{font-size:18px;color:var(--dim);margin-bottom:4px}
  .hmeta .yl{font-size:12.5px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .chip{font-size:11.5px;background:#252331;border:1px solid var(--line);color:var(--dim);
    padding:4px 11px;border-radius:999px}
  .chip.g{border-color:rgba(232,194,122,.4);color:var(--gold)}
  .chip.c{border-color:rgba(122,211,232,.34);color:var(--cyan)}
  .btns{display:flex;gap:9px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:14px;
    padding:10px 20px;border-radius:999px;transition:.18s;border:1px solid var(--line2);color:var(--txt);
    background:var(--card)}
  .btn:hover{transform:translateY(-1px);border-color:var(--dim2)}
  .btn.am{background:#fff;color:#111;border-color:#fff}
  .btn.yt{background:#2a1418;color:#ff8fa3;border-color:#4a2028}
  .tagline{margin-top:26px;font-size:17.5px;line-height:1.75;color:#ded9ec;
    border-left:3px solid var(--accent);padding-left:18px;font-weight:520}

  /* ---------- 快速事實 ---------- */
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:30px}
  .facts div{background:var(--bg2);padding:13px 16px}
  .facts dt{font-size:10.5px;letter-spacing:.16em;color:var(--dim2);text-transform:uppercase;margin-bottom:3px}
  .facts dd{font-size:14px;color:var(--txt);line-height:1.55}

  /* ---------- 區塊 ---------- */
  section{margin-top:56px;scroll-margin-top:24px}
  .shead{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;
    padding-bottom:11px;border-bottom:1px solid var(--line)}
  .snum{font-size:11px;letter-spacing:.16em;color:var(--dim2);font-variant-numeric:tabular-nums}
  .shead h2{font-size:19px;letter-spacing:.02em;font-weight:700;color:var(--accent2)}
  .shead .sen{font-size:11px;letter-spacing:.2em;color:var(--dim2);text-transform:uppercase;margin-left:auto}
  .prose p{font-size:15.5px;color:#d8d4e4;margin-bottom:14px}
  .prose p:last-child{margin-bottom:0}
  .prose em{color:var(--gold);font-style:normal;font-weight:600}

  /* ---------- 逐曲導聆 ---------- */
  .trk{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;
    background:linear-gradient(180deg,var(--bg2),#111017)}
  .trkhead{display:flex;align-items:center;gap:14px;padding:14px 17px;cursor:pointer;transition:.16s}
  .trkhead:hover{background:rgba(255,255,255,.03)}
  .tn{font-size:12px;color:var(--dim2);font-variant-numeric:tabular-nums;width:22px;flex:none}
  .tt{flex:1;min-width:0}
  .tt b{display:block;font-size:15.5px;font-weight:640;line-height:1.4}
  .tt span{font-size:12px;color:var(--dim2)}
  .tlen{font-size:12.5px;color:var(--dim2);font-variant-numeric:tabular-nums;flex:none}
  .tcar{font-size:11px;color:var(--dim2);flex:none;transition:.2s}
  .trk.open .tcar{transform:rotate(90deg)}
  .trkbody{display:none;padding:2px 17px 18px 53px;border-top:1px solid var(--line)}
  .trk.open .trkbody{display:block}
  .trkbody p{font-size:14.5px;color:#d3cfe0;margin:14px 0}
  .cues{border-left:2px solid var(--line2);padding-left:14px;margin:14px 0}
  .cue{display:flex;gap:12px;font-size:13.5px;margin-bottom:7px;align-items:baseline}
  .cue b{color:var(--cyan);font-variant-numeric:tabular-nums;flex:none;font-weight:600;font-size:12.5px}
  .cue span{color:var(--dim)}
  .tmeta{font-size:12.5px;color:var(--dim2);margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
  .tmeta b{color:var(--dim)}
  /* ---------- 影音延伸 ---------- */
  .vnote{font-size:13px;color:var(--dim2);line-height:1.75;margin-bottom:16px;
    border-left:2px solid var(--line2);padding-left:14px}
  .vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:11px}
  .vid{display:block;background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:15px 17px;text-decoration:none;transition:.18s}
  .vid:hover{border-color:#ff8fa3;transform:translateY(-2px);background:#1e1c27}
  .vtop{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
  .vkind{font-size:10.5px;letter-spacing:.1em;background:#2a1418;border:1px solid #4a2028;
    color:#ff8fa3;padding:3px 9px;border-radius:999px}
  .vsearch{font-size:10.5px;letter-spacing:.1em;background:#1f1d29;border:1px solid var(--line);
    color:var(--dim2);padding:3px 9px;border-radius:999px}
  .vlen{font-size:11.5px;color:var(--dim2);margin-left:auto;font-variant-numeric:tabular-nums}
  .vid b{display:block;font-size:14.5px;color:var(--txt);font-weight:640;line-height:1.45;margin-bottom:4px}
  .vby{display:block;font-size:12.5px;color:var(--dim);margin-bottom:5px}
  .vnt{display:block;font-size:12.5px;color:var(--dim2);line-height:1.6}

  /* ---------- 人物誌 ---------- */
  .people{display:grid;gap:14px}
  .pcard{border:1px solid var(--line);border-radius:15px;padding:19px 20px;background:var(--bg2)}
  .prole{font-size:10.5px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;margin-bottom:6px}
  .pname{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .plife{font-size:12.5px;color:var(--dim2);margin-bottom:12px;font-variant-numeric:tabular-nums}
  .pcard p{font-size:14.5px;color:#d3cfe0;margin-bottom:11px}
  .phere{background:rgba(250,75,110,.07);border-left:2px solid var(--accent);
    padding:11px 14px;border-radius:0 9px 9px 0;font-size:14px;color:#e2dded;margin-bottom:12px}
  .pkey{display:flex;gap:7px;flex-wrap:wrap}
  .pkey a{font-size:12px;background:#232130;border:1px solid var(--line);color:var(--dim);
    padding:5px 12px;border-radius:8px;text-decoration:none;transition:.16s}
  .pkey a:hover{border-color:var(--gold);color:var(--gold)}

  /* ---------- 表格 ---------- */
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tbl th{background:#1f1d29;color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    text-align:left;padding:11px 14px;font-weight:600;border-bottom:1px solid var(--line)}
  .tbl td{padding:12px 14px;border-bottom:1px solid var(--line);color:#d3cfe0;vertical-align:top}
  .tbl tr:last-child td{border-bottom:0}
  .tbl tr:hover td{background:rgba(255,255,255,.022)}
  .tbl .rec{color:var(--gold);white-space:nowrap;font-size:12.5px}
  .tblwrap{overflow-x:auto}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:9px 20px;font-size:14px}
  .kv dt{color:var(--dim2);white-space:nowrap}
  .kv dd{color:#d8d4e4}

  /* ---------- 通用小卡 ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}
  .cards a,.cards div.nc{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;text-decoration:none;transition:.18s}
  .cards a:hover{border-color:var(--accent);transform:translateY(-2px)}
  .cards b{display:block;font-size:14px;color:var(--txt);margin-bottom:3px;font-weight:640;line-height:1.4}
  .cards span{font-size:12.5px;color:var(--dim2);line-height:1.5;display:block}

  /* ---------- 時間軸 ---------- */
  .tl{border-left:2px solid var(--line2);padding-left:20px;margin-left:6px}
  .tlitem{position:relative;margin-bottom:20px}
  .tlitem::before{content:'';position:absolute;left:-26px;top:8px;width:9px;height:9px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
  .tlitem .ty{font-size:11.5px;letter-spacing:.14em;color:var(--gold);font-variant-numeric:tabular-nums}
  .tlitem b{display:block;font-size:15px;margin:2px 0 4px}
  .tlitem span{font-size:14px;color:var(--dim);line-height:1.65;display:block}

  /* ---------- 路線圖 ---------- */
  .road{display:grid;gap:12px}
  .rstep{border:1px solid var(--line);border-radius:14px;padding:17px 19px;background:var(--bg2);
    display:flex;gap:16px;align-items:flex-start}
  .rnum{width:30px;height:30px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#1a0d12;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .rstep b{display:block;font-size:15.5px;margin-bottom:5px}
  .rstep p{font-size:14.5px;color:#d3cfe0;margin:0}

  .srcs{font-size:12.5px;color:var(--dim2);line-height:2}
  .srcs a{color:var(--dim);text-decoration:none;border-bottom:1px dotted var(--line2)}
  .srcs a:hover{color:var(--accent2)}
  footer{margin-top:64px;padding-top:22px;border-top:1px solid var(--line);
    font-size:12px;color:var(--dim2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .none{color:var(--dim2);font-size:14px}
</style>
</head>
<body>
<div class="shell">
<nav class="toc"><div class="tocTitle">目錄</div><div id="toc"></div></nav>
<main id="main"></main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   資料區 —— 每張專輯只需要換掉這個 D 物件，其餘引擎完全不動
   ═══════════════════════════════════════════════════════════════ */
const D = {

/* ── 基本識別 ── */
artist:"Los Angeles Philharmonic & Gustavo Dudamel",
album:"Schumann: The Complete Symphonies",
year:2026,
label:"Platoon",
catalog:"PLAT31895",
genre:"古典 · 浪漫派交響曲",
styles:["Robert Schumann","交響曲全集","現場錄音","四首交響曲 · 17 軌"],
moods:["專注","週末黑膠","深夜"],
itunesTerm:"Schumann Complete Symphonies Dudamel Los Angeles Philharmonic",
ytTerm:"Dudamel Los Angeles Philharmonic Schumann Complete Symphonies",
wiki:"https://en.wikipedia.org/wiki/Gustavo_Dudamel",
compiled:"2026-08-19",

tagline:"2018 年錄下、2026 年才發行的八年封存。杜達美用這套舒曼，替他在洛杉磯的十七年畫下句點——而舒曼寫這四首曲子，也剛好用了十年，同樣是一場從春天走到崩潰邊緣的旅程。",

facts:[
  ["錄音","2018 年，Walt Disney Concert Hall（現場錄音）"],
  ["錄音場合","LA Phil「Schumann Focus」音樂節，2018 年 5 月 17 日起連續三個週末"],
  ["發行日","2026 年 8 月 7 日"],
  ["廠牌","Platoon（2018 年被 Apple 收購的廠牌）· PLAT31895"],
  ["版權標示","2026 Los Angeles Philharmonic，獨家授權 PLATOON Ltd."],
  ["內容","17 軌 · 總長 2 小時 12 分 41 秒"],
  ["第四號採用版本","1851 年杜塞道夫修訂版（Op.120）"],
  ["杜達美 LA Phil 任期","2009–2026，共 17 個樂季；現為榮譽音樂與藝術總監"],
  ["音質","Qobuz 標示 16-bit/44.1kHz 立體聲；未見官方標示 Hi-Res 或空間音訊版本"]
],

/* ── 1 錄音製作全紀錄 ── */
production:`這套錄音有一個罕見的時間差：演奏發生在 2018 年 5 月，唱片卻等到 2026 年 8 月才出版。中間隔了八年。

事情的起點是 LA Phil 2017–18 樂季末的「Schumann Focus」音樂節。2018 年 5 月 17 日星期四，杜達美在 Walt Disney Concert Hall 開場，上半場是內田光子睽違十三年重返該廳的舒曼鋼琴協奏曲，下半場是《第一號》。接著 5 月 19–20 日《第二號》、5 月 24–25 日《第三號「萊茵」》、5 月 26–27 日《第四號》，後兩組音樂會都搭配《傑諾維瓦》序曲與 Sol Gabetta 的大提琴協奏曲。5 月 22 日還有一場團員自組的全舒曼室內樂音樂會，整個系列在 6 月 1–3 日以 Peter Sellars 執導、Refik Anadol 影像設計的清唱劇《天堂與仙子》收尾。

當時在場的樂評 Richard S. Ginell 就在報導裡寫明：「這些演出同時在錄音，準備日後發行——但還不知道何時、由哪個廠牌。」答案要等八年後才揭曉：Platoon。這是一家 2018 年被 Apple 收購的廠牌，近年積極簽下古典陣容，LA Phil 與杜達美是其中最重要的一組。

錄音場地本身是這套唱片的主角之一。Walt Disney Concert Hall 由 Frank Gehry 設計、Nagata Acoustics 的豐田泰久負責音響，2003 年 10 月啟用，2,265 席的葡萄園式廳堂以極高的解析度著稱。Ginell 對這件事有一段很具體的觀察：舒曼的音樂似乎改變了這個廳的聲音本身——殘響變得更明顯，銅管的音色也和平常不同。他還特別點名首席定音鼓 Joseph Pereira 換上了小頭鼓槌，敲出接近十八世紀古樂團的槍響式聲響，把空氣「清出來」。這是理解這套錄音音響性格的一把鑰匙：它不是靠 EQ 修出來的透明，而是演奏方式本身就選擇了透明。

編制上，杜達美在協奏曲用室內樂團規模，交響曲則擴編——但擴的是弦樂，管樂與銅管維持一個聲部一人。這是當代舒曼演奏的主流解法：既要有交響的重量，又不能讓管樂堆疊把織體糊掉。另一個小細節：5 月 17 日那場，協奏曲他看譜，交響曲背譜。

需要誠實說明的是，各串流平台的頁面都沒有列出錄音製作人、錄音師與母帶工程師的姓名。LA Phil 的官方新聞稿附了一份可下載的內頁 PDF（Schumann Symphonies Nos 1–4），技術 credits 是否收錄其中尚未確認——若你手邊能打開那份檔案，這一欄可以再補上。`,

/* ── 2 深度樂評 ── */
review:`舒曼的交響曲有一個延續了一百多年的罪名：說他不會配器。這個說法的核心指控是，他把同一條線寫給太多樂器重複疊置，導致總譜「能演奏，但混濁」。二十世紀有整整幾代指揮家為此動手術——馬勒替《萊茵》重新配器，George Szell 大幅修剪，之後又出現用室內樂團從根本上稀釋織體的做法。

2010 年舒曼兩百週年之後，這件事變成了顯學。2013 年起 Rattle、Nézet-Séguin、Ticciati、Zacharias、Holliger、Tilson Thomas 接連推出全集，主流答案是「輕、快、透明」。杜達美 2018 年這套錄音就站在這個潮流裡，但他的做法有一點不同：他沒有縮編，而是靠廳堂、靠演奏方式、靠平衡的控制去換取清晰度。用 Ginell 的話說，Disney Hall 的高解析音響「盡其所能地把配器澄清了」。

結果是一種相當特別的質地：聲音是飽滿的、弦樂是厚的，但你依然聽得見中聲部。這在舒曼身上並不容易——他最麻煩的地方就是內聲部，中提琴、第二小提琴、法國號常常在同一個音區互相掩蓋。這套錄音裡那些平常會糊掉的地方大多站得住。

杜達美的詮釋取向可以用一個詞概括：結構優先。《洛杉磯時報》當年的評語說得很準——他「強調舒曼緊密的交響結構，並以令人豁然開朗的清晰度處理器樂平衡」，「這場演出重視方法而非瘋狂」。這句話同時是讚美也是保留。舒曼的音樂裡確實有「瘋狂」的那一面——他一生都在恐懼發瘋，最後也真的死在療養院裡——而杜達美選擇不去放大那個部分。他給的是一個健康的、明亮的、往前推的舒曼。

《第二號》的詼諧曲是全集裡最能說明他長處的一軌：節奏咬得極緊、輪廓刀刻一樣、樂團的技術完全跟得上。而同一首的 Adagio espressivo 則揭示了另一面——樂團在這裡提煉出舒曼作品裡那種迷人的抒情性與情感上的脆弱。這兩個樂章放在一起聽，你會理解為什麼《第二號》是舒曼最不像交響曲、卻最像自傳的一首。

Ginell 對 2018 年首場的保留意見值得一併記下：他認為當時杜達美「還沒有把個別器樂線條的分句與重音刻畫得夠銳利」，並建議去聽伯恩斯坦與維也納愛樂的版本當作示範。這是一個公允的比較點——伯恩斯坦那套的個性更強、更任性，杜達美這套則更均衡、更好聽、也更容易一次聽完四首。要哪一種，取決於你要的是舒曼這個人，還是舒曼這些作品。

最後一件事值得說。這套錄音發行的時間點不是偶然：它是杜達美十七年任期的告別禮。也因此，把它當成一場總結來聽是合理的——這是一個他從 28 歲帶到 45 歲的樂團，在他離開前留下的聲音樣本。從這個角度，錄音時間比發行時間早八年反而變成優點：你聽到的不是一場刻意為告別而製作的演出，而是一段關係正處在最穩定狀態時的實況。`,

 writer:"降e小調｜俗稱「大教堂樂章」，全集最著名的段落",
 note:`這是舒曼寫過最不像他自己的音樂，也是整套全集的重心。

背景是 1850 年 11 月，科隆大教堂舉行了 Johannes von Geissel 晉封樞機主教的典禮，舒曼夫婦曾造訪科隆。手稿上原本有一句題辭，大意是「具有伴隨一場莊嚴儀式的性格」，出版前照例刪掉了。舒曼的理由一貫：不要讓標題綁架耳朵。

音樂上，弦樂以 sforzando 的和弦劈開空間，隨即進入極弱的法國號與長號眾讚歌——三支長號在前面三個樂章一次都沒有吹過，整首曲子的第一個長號音就是這裡。這在演奏上是惡名昭彰的難關：冷的樂器、極弱的音量、暴露的和聲，任何一點不準都無所遁形。

聽這一軌等於在測試三件事：樂團銅管的控制力、廳堂的殘響、以及錄音有沒有把極弱音收住。Disney Hall 的解析度在這裡是決定性的。`,
 cues:[["開頭","弦樂的 sforzando 和弦，像大門被推開"],
       ["長號進入","全曲前三樂章長號完全沒吹過。第一個音就是極弱的眾讚歌——這是整套錄音最難的十秒"],
       ["對位展開","主題被層層堆疊，織體愈來愈密，像穹頂往上長"],
       ["高潮","銅管全奏，但注意舒曼從未讓它變成噪音"],
       ["尾聲","回到極弱，儀式結束，門重新關上"]],
 yt:"Schumann Symphony 3 Rhenish Feierlich cathedral movement Dudamel"},

{n:13, title:"第三號「萊茵」· V. Lebhaft", len:"5:23",
 writer:"降E大調｜舒曼最後一首交響曲的最後一個樂章",
 note:`從大教堂的陰影裡直接跳回陽光。這個對比是刻意的，也是五樂章結構真正的目的：如果沒有第四樂章，這個終曲只是一場愉快的節慶；有了第四樂章，它變成一種劫後餘生。

結尾處第四樂章的眾讚歌動機以明亮的方式再現一次，把整首曲子綁起來。這是舒曼在交響曲寫作上最成熟的手筆——也是他最後一次。三年後他投進了萊茵河。`,
 cues:[["開頭","明亮的降E大調，和上一樂章的降e小調只差一個調式"],
       ["中段","節慶式的推進，木管群的細節很多"],
       ["眾讚歌再現","第四樂章的動機以明亮的姿態回來，全曲在此完成閉環"],
       ["尾聲","舒曼交響曲寫作的終點。他三年後投進了萊茵河"]],
 yt:"Schumann Symphony 3 Rhenish finale Lebhaft Dudamel"},

/* ══ 第四號 ══ */
{n:14, title:"第四號 · I. Ziemlich langsam – Lebhaft", len:"11:09",
 writer:"d小調 Op.120（1851 年修訂版）｜原曲寫於 1841 年",
 note:`這首曲子的身世最複雜。它其實是舒曼第二部完成的交響曲，1841 年下半年寫成（各家對起訖日期說法不一，草稿據說只花了約一週），同年 12 月 6 日在萊比錫首演——但孟德爾頌無法出席，改由樂團首席 Ferdinand David 指揮，效果平庸；同場克拉拉還和李斯特合奏了雙鋼琴版《六人變奏》，風頭全被搶走。舒曼把總譜收了回去。

十年後的 1851 年，他在杜塞道夫用大約一週的時間重寫，1853 年由 Breitkopf & Härtel 以「第四號 Op.120」出版。這套錄音用的就是 1851 年版。

要先澄清一個常見的誤解：四樂章不間斷並不是 1851 年才有的設計，1841 年的原版本來就是這樣寫的（原標題甚至叫《交響幻想曲》）。修訂真正改掉的是兩件事：① 配器明顯加厚，聲部疊置更多——1851 版是濃湯，1841 版是清湯；② 終樂章把第一樂章的主題正式整合進來，主題統一感更強。另外修訂版把義大利文速度術語全部換成德文，樂章之間的接縫也重寫得更順。

這件事後來變成一場家族爭議。克拉拉在她主編的全集裡寫下「1841 年只是草稿、1851 年才完整配器」——這句話並不屬實。布拉姆斯極偏愛 1841 年版，不顧克拉拉強烈反對，於 1891 年把它出版了。

還有一個彩蛋：全曲的核心動機 F–E–D–C♯–D 被認為是移調過的「克拉拉主題」（C–B–A–G♯–A）。整首曲子從頭到尾都在念同一個人的名字。`,
 cues:[["開頭","極慢的導奏，注意那個下行五音動機——它是全曲的種子，也被認為是「克拉拉主題」"],
       ["轉入 Lebhaft","導奏的動機加速變成主題本身，和第一號用的是同一招"],
       ["發展部","1851 年版加厚配器的效果在這裡最明顯"],
       ["樂章結尾","不要停——四個樂章在這一版是連續不中斷的"]],
 yt:"Schumann Symphony No 4 D minor Dudamel Los Angeles Philharmonic"},

{n:15, title:"第四號 · II. Romanze: Ziemlich langsam", len:"4:12",
 writer:"a小調｜全集最短的一軌",
 note:`四分鐘，是整套全集最短的樂章，也是最溫柔的。雙簧管與大提琴齊奏出一段民謠式的旋律，簡單到近乎樸素。

中段獨奏小提琴的華彩線條是全曲最美的幾十秒——那條線在第一樂章的動機上盤旋，「克拉拉主題」在這裡以最原始的形態出現。舒曼寫這首曲子的 1841 年，是他和克拉拉結婚的第二年。

這一軌短到很容易被跳過，但它是整首曲子的心臟。`,
 cues:[["開頭","雙簧管與大提琴的齊奏，民謠質地"],
       ["獨奏小提琴進入","全曲最美的段落。那條華彩線繞著第一樂章的動機打轉"],
       ["結尾","不解決、直接接進詼諧曲"]],
 yt:"Schumann Symphony 4 Romanze Ziemlich langsam Dudamel"},

{n:16, title:"第四號 · III. Scherzo: Lebhaft", len:"6:00",
 writer:"d小調｜主題是第一樂章動機的倒影",
 note:`詼諧曲的開頭是核心動機的倒影——原本往下走的線被翻過來往上走。舒曼在這首曲子裡把「主題循環」推到了 1841 年的極限，這種寫法比李斯特的交響詩還早。

三聲中部把第二樂章那段獨奏小提琴的華彩直接搬過來，是全曲最明顯的一次跨樂章引用。

另外一個學術上的小發現：詼諧曲的音型被指出借用自 Kalliwoda 的第一號交響曲 Op.7。`,
 cues:[["開頭","主題是第一樂章動機的倒影——原本往下，現在往上"],
       ["三聲中部","第二樂章的獨奏小提琴華彩被直接搬過來"],
       ["再現","比第一次更急促"],
       ["結尾","不收尾，而是直接懸空進入終樂章的長段過渡"]],
 yt:"Schumann Symphony 4 Scherzo Lebhaft Dudamel"},

{n:17, title:"第四號 · IV. Langsam – Lebhaft", len:"9:17",
 writer:"D大調｜從詼諧曲的黑暗長出來的過渡，是全曲最著名的段落",
 note:`終樂章前面那段 Langsam 過渡是舒曼寫過最有戲劇性的幾十小節：從詼諧曲結尾的懸空狀態出發，弦樂在極弱中不斷試探，銅管一點一點透進來，然後突然爆發成 D 大調的主題。這一段常被拿來和貝多芬第五號從第三樂章接到終樂章的過渡相提並論，而舒曼寫它的時候是 1841 年。

主題本身是第一樂章主題的大調化——同一個素材走了四十分鐘，終於從 d 小調翻成 D 大調。1851 年修訂版還多做了一件事：把第一樂章主題與終曲的凱旋主題正式整合起來，1841 年版沒有走到這一步。這是修訂版最有力的辯護理由。

呈示部末尾的銅管眾讚歌在修訂版有反覆，原版沒有。最後的加速衝刺，就是你在專輯介紹裡讀到的「令人血脈賁張的終章」。`,
 cues:[["開頭 Langsam","從黑暗中試探——舒曼版的貝多芬第五號過渡，而且早了很多人一步"],
       ["爆發進入 Lebhaft","d 小調終於翻成 D 大調。同一個動機走了四十分鐘才走到這裡"],
       ["銅管眾讚歌","1851 年修訂版在這裡加了反覆，1841 年版沒有"],
       ["主題整合","第一樂章主題與終曲凱旋主題正式合流，這是修訂版最重要的改動"],
       ["尾聲加速","全集的終點。杜達美在這裡完全放開"]],
 yt:"Schumann Symphony 4 finale Langsam Lebhaft Dudamel"}
],

people:[
{role:"作曲", name:"Robert Schumann 羅伯特・舒曼", life:"1810 年 6 月 8 日–1856 年 7 月 29 日 · 生於薩克森茨維考，卒於波昂近郊 Endenich 療養院",
 bio:`書商之子，本來要當鋼琴家，因手指出問題（原因至今無定論）而轉向作曲與樂評。他同時是十九世紀最重要的音樂評論家之一，創辦《新音樂雜誌》，用「弗洛雷斯坦」與「歐塞比烏斯」兩個虛構人格輪流寫作——一個外向衝動、一個內省憂鬱。那不只是文學遊戲，那是他真實的內在結構。

1840 年他打贏與克拉拉父親的官司終於結婚，那一年寫了一百多首藝術歌曲；1841 年火力全轉向管弦樂，一年內寫出第一號與 d 小調（後來的第四號）。之後 1845–46 年寫第二號、1850 年寫第三號。四首交響曲，剛好橫跨十年。

1850 年他到杜塞道夫任市音樂總監，但因害羞與精神狀態不穩無法駕馭樂團，三年後辭職。1853 年他認識了二十歲的布拉姆斯，寫下人生最後一篇樂評〈新的道路〉。1854 年 2 月 27 日他投入萊茵河自殺未遂，被漁夫救起，依他自己的要求住進 Endenich 療養院。院方認為病患與親屬接觸有害，布拉姆斯與姚阿幸獲准探視，克拉拉卻直到他去世前兩天才見到丈夫。官方死亡記錄是肺炎，真正死因至今仍有爭議。`,
 here:"四首交響曲是他一生最清醒與最危險的十年的橫切面。第一號寫於新婚後的亢奮期，四天完成草稿；第二號寫於 1844 年崩潰之後，他自己說音樂「透露出我當時的狀態」；第三號寫於杜塞道夫上任那年，是他最外向的作品，也是他最後一首交響曲；第四號則是 1841 年的舊作在十年後被重新打磨。按寫作順序聽這四首，你會聽見一個人如何用同樣的形式，記錄自己從春天走到療養院的路。",
 key:[["鋼琴協奏曲 a小調 Op.54","1845"],["幻想曲集《克萊斯勒魂》","1838"],["聯篇歌曲《詩人之戀》","1840"],["《童年即景》","1838"],["《狂歡節》Op.9","1835"],["大提琴協奏曲 a小調","1850"]]},

{role:"推手 · 版本守門人", name:"Clara Schumann 克拉拉・舒曼", life:"1819–1896 · 十九世紀最重要的鋼琴家之一",
 bio:`九歲登台，十九世紀最負盛名的演奏家之一，職業生涯橫跨六十年。她也是作曲家，但婚後幾乎停筆，把精力放在演奏、教學、養育八個孩子，以及推廣丈夫的作品上。羅伯特死後她又活了四十年，成為舒曼作品最權威也最強勢的守護者。`,
 here:`這四首交響曲能存在，很大程度上是她推的。她在日記裡寫過：「最好他能為管弦樂團作曲；他的想像力在鋼琴上找不到足夠的空間……但願我能促成此事。」1845 年她與羅伯特一起密集研究對位法，那段自習直接改變了第二號的寫法。

但她也是第四號版本爭議的中心。她在自己主編的全集裡寫下「1841 年只是草稿、1851 年才完整配器」——這句話並不屬實。布拉姆斯堅信 1841 年原版更好，不顧她強烈反對於 1891 年出版。這場爭執到今天都還沒結束：這張唱片選的是克拉拉那一邊。

還有一個更私密的線索：第四號的核心動機被認為是移調過的「克拉拉主題」。整首曲子從頭到尾都在念同一個人的名字。`,
 key:[["鋼琴三重奏 g小調 Op.17","1846"],["鋼琴協奏曲 a小調 Op.7","1835"],["六首歌曲 Op.13","1844"]]},

{role:"指揮", name:"Gustavo Dudamel 古斯塔沃・杜達美", life:"1981 年 1 月 26 日生 · 委內瑞拉巴基西梅托",
 bio:`長號手的兒子，五歲進入委內瑞拉的音樂教育體系 El Sistema，先學小提琴，1995 年開始學指揮，師從 El Sistema 創辦人 José Antonio Abreu。1999 年、十八歲時就當上西蒙・玻利瓦交響樂團音樂總監，2004 年贏得馬勒國際指揮大賽，2007 年起任哥德堡交響樂團首席指揮。

2007 年 4 月，二十六歲的他被宣布將接掌洛杉磯愛樂，2009 年 9 月正式上任。這是古典樂界近三十年最受矚目的任命之一。他也曾任巴黎歌劇院音樂總監（2021–2023）。2023 年 2 月宣布將於 2025–26 樂季結束後卸任 LA Phil，轉任紐約愛樂音樂與藝術總監，2026–27 樂季正式就任——是史上第一位擔任該職的拉丁美洲人。

他偏愛「全集」這種形式：在洛杉磯的十七年間，他已經做過貝多芬、布拉姆斯、柴可夫斯基、舒伯特，以及 2012 年那次在二十四天內跑完馬勒全集的瘋狂計畫。`,
 here:`舒曼全集是他這一系列全集裡的最後一套，也是任期的收尾之作。他的取向是結構優先：《洛杉磯時報》的評語是他「強調舒曼緊密的交響結構，並以令人豁然開朗的清晰度處理器樂平衡」，「重視方法而非瘋狂」。

具體做法上，他沒有像 Ticciati、Nézet-Séguin 那樣用室內樂團稀釋織體，而是擴編弦樂、管樂與銅管維持一個聲部一人，靠平衡的控制去換清晰度。2018 年首場（第一號）他協奏曲看譜、交響曲全程背譜。

當年也有保留意見：樂評 Richard S. Ginell 認為 2018 年首場時他「還沒把個別器樂線條的分句與重音刻畫得夠銳利」，並推薦去聽伯恩斯坦與維也納愛樂的版本作對照。這個比較點到今天仍然成立。`,
 key:[["Beethoven Symphonies 5 & 7","2006"],["The Rite of Spring","2010"],["Mahler Symphony No. 8","2012"],["Tchaikovsky Symphony No. 5","2009"],["Ives Complete Symphonies","2020"]]},

{role:"演奏", name:"Los Angeles Philharmonic 洛杉磯愛樂", life:"1919 年創立 · 駐地 Walt Disney Concert Hall",
 bio:`1919 年由銅礦大亨、業餘小提琴家 William Andrews Clark Jr. 獨資創辦。他原本邀請拉赫瑪尼諾夫擔任首任音樂總監，被婉拒後改聘馬勒的前助理 Walter Henry Rothwell。1922 年起在好萊塢露天劇場舉行夏季樂季，那是全美規模最大的戶外古典樂系列。

歷任音樂總監包括 Otto Klemperer、Zubin Mehta、Carlo Maria Giulini、André Previn、Esa-Pekka Salonen，然後是杜達美。2026 年 5 月宣布由 Daniel Harding 自 2027–28 樂季接任。這是全美最勇於委創新作的大型樂團之一。`,
 here:"這套錄音真正的主角其實是樂團的技術水準。《第二號》詼諧曲那段全速的無窮動、《第三號》第四樂章長號在冷的狀態下吹出的極弱眾讚歌——這兩處都是只有頂級樂團才做得到的。當年的樂評也特別點名首席定音鼓 Joseph Pereira 換用小頭鼓槌，敲出接近古樂團的槍響式聲響，把織體「清出來」。這種細節不會寫在唱片封面上，但它決定了這套錄音聽起來的樣子。",
 key:[["Ives: Complete Symphonies","2020"],["Adams: City Noir","2014"],["Mahler: Symphony No. 8","2012"]]},

{role:"首席定音鼓", name:"Joseph Pereira", life:"1974 年生 · 兼作曲家與教師",
 bio:`茱莉亞音樂院打擊樂碩士，1997 至 2008 年在紐約愛樂，2007 年由 Esa-Pekka Salonen 拔擢為洛杉磯愛樂首席定音鼓。他同時是作曲家，作品受 LA Phil、Colin Currie Group、Miró Quartet 等委約，也主持 USC Thornton 音樂院的打擊樂教研室。`,
 here:"當年的現場樂評特別點名了他：在這批舒曼演出裡，他改用小頭鼓槌敲擊鼓面，做出接近十八世紀古樂團的乾脆槍響聲，把空氣暫時「清出來」。這是一個非常具體的技術決定，也直接影響了整套錄音的透明度——尤其在第一號，那是史上第一部要求三顆定音鼓的大型管弦作品。",
 key:[]}
],

 legacy:`要判斷這套錄音的歷史地位，現在還太早——它才發行兩週。但可以先把它放進脈絡裡。

2010 年舒曼兩百週年之後出現了一波「舒曼交響曲熱」，2013 年起 Rattle、Nézet-Séguin、Ticciati、Zacharias、Holliger、Tilson Thomas、Skrowaczewski 陸續推出全集，共同的問題意識是：如何洗掉「舒曼不會配器」這個罪名。主流答案是縮編、加速、增加透明度。

杜達美這套的位置很特別：它站在同一個潮流裡，卻沒有用縮編這個手段。它靠的是廳堂與演奏方式。這使它成為少數在「現代大型樂團 ＋ 高解析廳堂」這個條件下做出來的當代舒曼全集，音響上的參考價值不低。

另一個會被記住的點是它的發行脈絡。這不是一套為了錄音而錄音的唱片，而是一段十七年關係的封存與告別。八年的時差反而讓它更像一份文件——2018 年那個 37 歲、已經在洛杉磯待了九年的杜達美，和他的樂團當時的樣子。`

/* ── 7 脈絡與影響網絡 ── */
context:{
 era:`舒曼的四首交響曲橫跨 1841 到 1851 年，剛好是他一生中最清醒與最危險的十年。

這十年的背景是：貝多芬 1827 年去世，留下一個所有人都不知道該怎麼接的問題——交響曲之後還能怎麼寫。舒伯特的「偉大」C 大調交響曲在 1839 年才由舒曼本人發現、孟德爾頌首演，那次經驗直接刺激他動筆寫自己的第一首。同時代的白遼士往標題音樂走、孟德爾頌往古典形式的精緻化走、李斯特之後往交響詩走，而舒曼選的是第三條路：保留古典的四樂章架構，但用主題循環把整首曲子綁成一個有機體。

第四號在 1841 年就做到了四樂章不間斷、全曲共用一個核心動機——這比李斯特的交響詩早，也比法朗克、辛克的循環形式早了幾十年。它當年沒有成功，但那個想法後來成了整個晚期浪漫派的標準配備。

至於「舒曼不會配器」這個罪名，它有一半是技術問題（他指揮經驗不足，習慣用重複疊置來確保聲部被聽見），另一半是時代問題（十九世紀後期的大編制演奏方式讓那些疊置變成泥漿）。二十一世紀的解法通常是回到較輕的織體——這套錄音就是這個潮流裡的一員。`,

roadmap:[
 {title:"第一次聽 · 照唱片順序，一次一首", body:"四首交響曲不是一張專輯，是四件獨立的作品。不要一次聽完 2 小時 12 分。建議一次一首，中間隔開。第一次聽只需要感覺每一首的性格差異：第一號是外向的春天，第二號是掙扎，第三號是最陽光也最莊嚴的一首，第四號是最緊密、最一氣呵成的一首。"},
 {title:"第二次聽 · 改用寫作順序", body:"真正的順序是：第一號（1841 春）→ 第四號（1841 秋，原始構想）→ 第二號（1845–46，崩潰之後）→ 第三號（1850，杜塞道夫）。按這個順序聽，你會聽到一條清楚的人生曲線：亢奮 → 野心 → 掙扎 → 短暫的陽光。三年後他投進了萊茵河。"},
 {title:"第三次聽 · 只追動機", body:"舒曼四首交響曲都在做同一件事：用一個核心動機貫穿全曲。第一號是開頭的銅管召集令，第二號是那個極弱的銅管 motto，第四號是那個下行五音（被認為是「克拉拉主題」）。挑一首，全程只追那個動機在哪裡出現、變成了什麼樣子。這是理解舒曼交響思維最直接的方式。"},
 {title:"進階 · 兩個第四號對照聽", body:"這張用的是 1851 年修訂版。去找一套 1841 年原版（布拉姆斯 1891 年出版的那個），同一首曲子聽兩遍。差別非常明顯：兩版都是四樂章不間斷，但 1851 版配器厚重、主題整合更完整，1841 版織體輕透得多。克拉拉堅持前者、布拉姆斯堅持後者，這場家族爭執到今天還沒有結論——聽完你會有自己的答案。"},
 {title:"重點單曲 · 只有二十分鐘的話", body:"聽兩軌：《第二號》的詼諧曲（技術的極限）與《第三號》第四樂章「Feierlich」（音樂的重量）。前者告訴你這個樂團有多好，後者告訴你這套錄音的音響到底能不能撐住舒曼最難的地方。"},
 {title:"情境 · 音量 · 訊源", body:"這是現場錄音，動態範圍大，適合安靜的環境與稍大一點的音量——但不要為了聽清楚極弱段落而把整體音量開太大，《第三號》第四樂章和《第四號》終樂章的全奏會把你嚇到。喇叭優於耳機，因為 Disney Hall 的空間感是這套錄音的一部分，耳機會把它壓扁。不適合通勤或當工作背景音樂：舒曼的內聲部太密，注意力一分散就只剩下一團好聽的聲音。"}

 {kind:"紀錄片", title:"Did Schumann Have Bipolar Disorder?", by:"Great Performances | PBS",
  url:"https://www.youtube.com/watch?v=egaNeMqfBts",
  note:"同一集的正片片段，Scott Yoo 與精神科醫師 Richard Kogan 對談。理解第二號那種分裂感的最佳背景資料。"},
 {kind:"訪談講座", title:"Richard Kogan: Schumann, Bipolar Disorder and Creative Genius", by:"Richard Kogan（茱莉亞出身的鋼琴家兼精神科醫師）",
  url:"https://www.youtube.com/watch?v=Ng7sNvwPpVA",
  note:"他邊彈邊講，用音樂本身示範躁期與鬱期如何寫進舒曼的樂句。2018 年那場音樂節的演前導聆就是他主講的。"},
 {kind:"訪談講座", title:"Schumann, Bipolar Disorder, and the Creative Process", by:"Psychiatric News（美國精神醫學會官方媒體）",
  url:"https://www.youtube.com/watch?v=68Z-QcnKUZI",
  note:"同一主題的 APA 官方完整版，機構背書、內容較長。"},
 {kind:"分析導讀", title:"Gerard Schwarz 分析《第三號「萊茵」》", by:"All-Star Orchestra / Khan Academy Partners",
  url:"https://www.youtube.com/watch?v=yI7kDoB6YsI",
  note:"指揮家逐段拆解這首曲子，含 1850 年萊茵河之旅與科隆大教堂的創作背景。系列共五集，其餘幾集在 Khan Academy 同一單元。"},
 {kind:"分析導讀", title:"The Greatest Recordings EVER! Schumann: \"Rhenish\" Symphony", by:"Dave Hurwitz（The Ultimate Classical Music Guide）",
  url:"https://www.youtube.com/watch?v=k4ChBvRExfc",
  note:"資深樂評的版本大比較。聽完你會有一把尺，去衡量杜達美這一版站在詮釋光譜的哪個位置。"},
 {kind:"分析導讀", title:"舒曼配器爭議與馬勒的重新配器", q:"Schumann orchestration problem Mahler reorchestration symphonies explained",
  note:"「舒曼不會配器」這個罪名是理解所有現代舒曼錄音的前提，也是第四號 1851 版爭議的核心。這張用的正是 1851 版。"},
 {kind:"訪談", title:"杜達美告別洛杉磯愛樂十七年", q:"Gustavo Dudamel LA Phil final season interview 2026",
  note:"這套唱片的定位就是十七年任期的總結。看官方告別訪談，會比較理解為什麼 2018 年的錄音要壓到 2026 年才發行。"},
 {kind:"提醒", title:"LA Phil 官網那四段「Video Preview」不是介紹影片", q:"Dudamel Schumann Complete Symphonies LA Phil official trailer",
  note:"官網列出的四個連結經查證是 YouTube 自動生成的 Topic 頻道音檔（封面配音樂），不是導聆素材。目前確認沒有專為這張專輯拍的官方 trailer；日後若有，用這組關鍵字可以找到。"}

/* ── 12 資料來源 ── */
sources:[
 {title:"LA Phil 官方唱片頁 — Schumann: Complete Symphonies", url:"https://www.laphil.com/artists-and-media/recordings-and-media/recordings/schumann-complete-symphonies"},
 {title:"LA Phil 新聞稿（2026-07-27）— 發行公告與杜達美談話", url:"https://www.hollywoodbowl.com/press/releases/2249"},
 {title:"Qobuz — 曲目、時長、發行資料", url:"https://www.qobuz.com/gb-en/album/schumann-complete-symphonies-los-angeles-philharmonic-and-gustavo-dudamel/t0z8is48e0tzb"},
 {title:"Apple Music — Schumann: The Complete Symphonies", url:"https://music.apple.com/us/album/schumann-the-complete-symphonies/6774131756"},
 {title:"Classical Voice North America — Dudamel Begins Schumann Cycle On Promising Note（2018-05-21）", url:"https://classicalvoiceamerica.org/2018/05/21/dudamel-begins-schumann-cycle-on-promising-note/"},
 {title:"San Francisco Classical Voice — Schumann Cycle Launches at LA Phil（2018-05-22）", url:"https://www.sfcv.org/articles/review/schumann-cycle-launches-la-phil"},
 {title:"Wikipedia — Symphony No. 1 (Schumann)", url:"https://en.wikipedia.org/wiki/Symphony_No._1_(Schumann)"},
 {title:"Wikipedia — Symphony No. 2 (Schumann)", url:"https://en.wikipedia.org/wiki/Symphony_No._2_(Schumann)"},
 {title:"Wikipedia — Symphony No. 3 (Schumann)", url:"https://en.wikipedia.org/wiki/Symphony_No._3_(Schumann)"},
 {title:"Wikipedia — Symphony No. 4 (Schumann)", url:"https://en.wikipedia.org/wiki/Symphony_No._4_(Schumann)"},
 {title:"Wikipedia — Robert Schumann", url:"https://en.wikipedia.org/wiki/Robert_Schumann"},
 {title:"Wikipedia — Gustavo Dudamel", url:"https://en.wikipedia.org/wiki/Gustavo_Dudamel"},
 {title:"Wikipedia — Los Angeles Philharmonic", url:"https://en.wikipedia.org/wiki/Los_Angeles_Philharmonic"},
 {title:"Kenneth Woods — Explore the Score: Schumann Symphony in D minor（1841 / 1851 版本逐處比對）", url:"https://kennethwoods.net/blog1/2013/01/19/explore-the-score-schumann-symphony-no-4/"},
 {title:"USC Thornton — Joseph Pereira", url:"https://music.usc.edu/joseph-pereira/"}
]
};

/* ═══════════════════════════════════════════════════════════════
   渲染引擎 —— 以下不需要修改
   ═══════════════════════════════════════════════════════════════ */
const E = s => String(s==null?'':s);
const has = x => Array.isArray(x) ? x.length>0 : (x && Object.keys(x).length>0);
const amURL = t => 'https://music.apple.com/tw/search?term=' + encodeURIComponent(t);
const ytURL = t => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(t);
const P = txt => E(txt).split(/\n\s*\n/).map(x=>`<p>${x.trim()}</p>`).join('');

document.title = `${D.album} · 深度導聆`;

const SEC = [];
function sec(id, zh, en, html){ if(html) SEC.push({id, zh, en, html}); }

/* 1 · 錄音製作全紀錄 */
sec('production','錄音製作全紀錄','Production', D.production ? `<div class="prose">${P(D.production)}</div>` : '');

/* 2 · 深度樂評 */
sec('review','深度樂評','Critique', D.review ? `<div class="prose">${P(D.review)}</div>` : '');

/* 3 · 逐曲導聆 */
sec('tracks','逐曲導聆','Track by Track', has(D.tracks) ? D.tracks.map((t,i)=>`
  <div class="trk" data-i="${i}">
    <div class="trkhead">
      <span class="tn">${t.n||i+1}</span>
      <span class="tt"><b>${E(t.title)}</b>${t.writer?`<span>${E(t.writer)}</span>`:''}</span>
      <span class="tlen">${E(t.len)}</span>
      <span class="tcar">▶</span>
    </div>
    <div class="trkbody">
      ${t.note?P(t.note):''}
      ${has(t.cues)?`<div class="cues">${t.cues.map(c=>`<div class="cue"><b>${E(c[0])}</b><span>${E(c[1])}</span></div>`).join('')}</div>`:''}
      ${t.personnel?`<div class="tmeta"><b>編制：</b>${E(t.personnel)}</div>`:''}
    </div>
  </div>`).join('') : '');

/* 4 · 人物誌 */
sec('people','人物誌 · 作曲家／演奏家／主唱','People', has(D.people) ? `<div class="people">${
  D.people.map(p=>`
  <div class="pcard">
    <div class="prole">${E(p.role)}</div>
    <div class="pname">${E(p.name)}</div>
    <div class="plife">${E(p.life)}</div>
    ${p.bio?P(p.bio):''}
    ${p.here?`<div class="phere"><b style="color:var(--accent)">在這張專輯裡 · </b>${E(p.here)}</div>`:''}
    ${has(p.key)?`<div class="pkey">${p.key.map(k=>`<a href="${amURL(p.name+' '+k[0])}" target="_blank" rel="noopener">${E(k[0])}${k[1]?` · ${k[1]}`:''}</a>`).join('')}</div>`:''}
  </div>`).join('')}</div>` : '');

/* 5 · 完整 Credits */
sec('credits','完整 Credits','Credits', has(D.credits) ?
  `<dl class="kv">${D.credits.map(c=>`<dt>${E(c[0])}</dt><dd>${E(c[1])}</dd>`).join('')}</dl>` : '');

/* 6 · 評價與歷史地位 */
let recHTML = '';
if(has(D.reception)){
  const R = D.reception;
  if(has(R.scores)) recHTML += `<div class="tblwrap"><table class="tbl"><thead><tr><th>來源</th><th>評價</th></tr></thead><tbody>${
    R.scores.map(s=>`<tr><td>${E(s[0])}</td><td>${E(s[1])}</td></tr>`).join('')}</tbody></table></div>`;
  if(has(R.chart)) recHTML += `<div style="margin-top:16px"><dl class="kv">${
    R.chart.map(c=>`<dt>${E(c[0])}</dt><dd>${E(c[1])}</dd>`).join('')}</dl></div>`;
  if(has(R.awards)) recHTML += `<div style="margin-top:16px" class="cards">${
    R.awards.map(a=>`<div class="nc"><b>${E(a[0])}</b><span>${E(a[1])}</span></div>`).join('')}</div>`;
  if(R.legacy) recHTML += `<div class="prose" style="margin-top:20px">${P(R.legacy)}</div>`;
}
sec('reception','評價與歷史地位','Reception & Legacy', recHTML);

/* 7 · 脈絡與影響網絡 */
let ctxHTML = '';
if(has(D.context)){
  const C = D.context;
  if(C.era) ctxHTML += `<div class="prose">${P(C.era)}</div>`;
  if(has(C.timeline)) ctxHTML += `<div class="tl" style="margin-top:22px">${
    C.timeline.map(t=>`<div class="tlitem"><div class="ty">${E(t[0])}</div><b>${E(t[1])}</b><span>${E(t[2])}</span></div>`).join('')}</div>`;
  const grp = (title, arr) => has(arr) ? `<div style="margin-top:24px">
    <div style="font-size:11px;letter-spacing:.18em;color:var(--dim2);text-transform:uppercase;margin-bottom:9px">${title}</div>
    <div class="cards">${arr.map(x=>`<a href="${amURL(x[0]+' '+(x[1]||''))}" target="_blank" rel="noopener">
      <b>${E(x[1]||x[0])}</b><span>${E(x[1]?x[0]:'')}${x[2]?` — ${E(x[2])}`:''}</span></a>`).join('')}</div></div>` : '';
  ctxHTML += grp('影響了這張的作品', C.influencedBy);
  ctxHTML += grp('被這張影響的作品', C.influenced);
  ctxHTML += grp('翻唱 · 取樣 · 引用', C.covers);
}
sec('context','脈絡與影響網絡','Context & Influence', ctxHTML);

/* 8 · 版本／音質指南 */
sec('versions','版本／音質指南','Editions & Sound', has(D.versions) ? `<div class="tblwrap">
  <table class="tbl"><thead><tr><th>版本</th><th>年份</th><th>母帶／載體</th><th>說明</th><th>推薦</th></tr></thead>
  <tbody>${D.versions.map(v=>`<tr>
    <td><b style="color:var(--txt)">${E(v.name)}</b></td><td>${E(v.year)}</td>
    <td>${E(v.source)}</td><td>${E(v.note)}</td>
    <td class="rec">${'★'.repeat(v.rec||0)}${'☆'.repeat(Math.max(0,5-(v.rec||0)))}</td></tr>`).join('')}
  </tbody></table></div>${D.versionsNote?`<div class="prose" style="margin-top:18px">${P(D.versionsNote)}</div>`:''}` : '');

/* 9 · 聆聽路線圖 */
sec('roadmap','聆聽路線圖','How to Listen', has(D.roadmap) ? `<div class="road">${
  D.roadmap.map((r,i)=>`<div class="rstep"><div class="rnum">${i+1}</div>
    <div><b>${E(r.title)}</b><p>${E(r.body)}</p></div></div>`).join('')}</div>` : '');

/* 10 · 視覺與實體 */
sec('physical','視覺與實體','Artwork & Object', has(D.physical) ?
  `<dl class="kv">${Object.entries(D.physical).map(([k,v])=>`<dt>${E(k)}</dt><dd>${E(v)}</dd>`).join('')}</dl>` : '');

/* 11 · 影音延伸 —— 介紹、紀錄片、訪談；不是聽音樂的連結 */
sec('videos','影音延伸','Watch', has(D.videos) ? `
  <div class="vnote">以下都是「認識這張唱片」的影音資料——官方介紹、紀錄片、分析與訪談，不是拿來聽音樂的。
  標示「搜尋」的項目會帶你到 YouTube 的搜尋結果頁（影片會下架、網址會失效，用搜尋比較耐放）。</div>
  <div class="vids">${D.videos.map(v=>`
    <a class="vid" href="${v.url ? E(v.url) : ytURL(v.q || (D.artist+' '+D.album))}" target="_blank" rel="noopener">
      <div class="vtop">
        <span class="vkind">${E(v.kind||'影片')}</span>
        ${v.url ? '' : '<span class="vsearch">搜尋</span>'}
        ${v.len ? `<span class="vlen">${E(v.len)}</span>` : ''}
      </div>
      <b>${E(v.title)}</b>
      ${v.by ? `<span class="vby">${E(v.by)}</span>` : ''}
      ${v.note ? `<span class="vnt">${E(v.note)}</span>` : ''}
    </a>`).join('')}</div>` : '');

/* 12 · 延伸聆聽 */
sec('further','延伸聆聽','Go Deeper', has(D.further) ? `<div class="cards">${
  D.further.map(f=>`<a href="${amURL(f.artist+' '+f.album)}" target="_blank" rel="noopener">
    <b>${E(f.album)}</b><span>${E(f.artist)}${f.why?`<br>${E(f.why)}`:''}</span></a>`).join('')}</div>` : '');

/* 13 · 資料來源 */
sec('sources','資料來源','Sources', has(D.sources) ? `<div class="srcs">${
  D.sources.map(s=>s.url?`<a href="${E(s.url)}" target="_blank" rel="noopener">${E(s.title)}</a>`:E(s.title)).join(' · ')}</div>` : '');

/* ---------- HERO ---------- */
const heroHTML = `
  ${D.backLink!==false?`<a class="back" href="${E(D.backLink||'../index.html')}">← 回專輯推薦</a>`:''}
  <div class="hero">
    <div class="hart" id="hart"><div class="ph">${E(D.album).slice(0,2)}</div></div>
    <div class="hmeta">
      <div class="kicker">深度導聆 · Deep Listening</div>
      <h1>${E(D.album)}</h1>
      <div class="who">${E(D.artist)}</div>
      <div class="yl">${E(D.year)}${D.label?` · ${E(D.label)}`:''}${D.catalog?` · ${E(D.catalog)}`:''}</div>
      <div class="chips">
        ${D.genre?`<span class="chip g">${E(D.genre)}</span>`:''}
        ${(D.styles||[]).map(s=>`<span class="chip">${E(s)}</span>`).join('')}
        ${(D.moods||[]).map(s=>`<span class="chip c">${E(s)}</span>`).join('')}
      </div>
      <div class="btns">
        <a class="btn am" href="${amURL(D.itunesTerm || (D.artist+' '+D.album))}" target="_blank" rel="noopener">▶ 在 Apple Music 聽</a>
        ${has(D.videos)?`<a class="btn yt" href="#videos">▶ 影音延伸 · ${D.videos.length}</a>`:''}
        ${D.wiki?`<a class="btn" href="${E(D.wiki)}" target="_blank" rel="noopener">Wikipedia</a>`:''}
      </div>
    </div>
  </div>
  ${D.tagline?`<div class="tagline">${E(D.tagline)}</div>`:''}
  ${has(D.facts)?`<dl class="facts">${D.facts.map(f=>`<div><dt>${E(f[0])}</dt><dd>${E(f[1])}</dd></div>`).join('')}</dl>`:''}`;

document.getElementById('main').innerHTML = heroHTML + SEC.map((s,i)=>`
  <section id="${s.id}">
    <div class="shead"><span class="snum">${String(i+1).padStart(2,'0')}</span>
      <h2>${s.zh}</h2><span class="sen">${s.en}</span></div>
    ${s.html}
  </section>`).join('') + `
  <footer><span>${E(D.artist)} — ${E(D.album)}</span><span>由 Claude 整理 · ${E(D.compiled||'')}</span></footer>`;

document.getElementById('toc').innerHTML = SEC.map(s=>`<a href="#${s.id}">${s.zh.split(' · ')[0]}</a>`).join('');

/* 逐曲展開 */
document.querySelectorAll('.trkhead').forEach(h=>{
  h.onclick = ()=> h.parentElement.classList.toggle('open');
});

/* 目錄高亮 */
const links = [...document.querySelectorAll('#toc a')];
const obs = new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    links.forEach(l=>l.classList.toggle('on', l.getAttribute('href')==='#'+e.target.id));
  }});
},{rootMargin:'-10% 0px -75% 0px'});
SEC.forEach(s=>{ const el=document.getElementById(s.id); if(el) obs.observe(el); });

/* 封面：iTunes Search API（JSONP，可在 file:// 直接跑） */
(function(){
  if(D.cover){ document.getElementById('hart').innerHTML = `<img src="${D.cover}" alt="">`; return; }
  const cb = '__amcb1';
  const s = document.createElement('script');
  window[cb] = j => {
    const r = (j.results||[])[0];
    if(r && r.artworkUrl100)
      document.getElementById('hart').innerHTML =
        `<img src="${r.artworkUrl100.replace('100x100bb','1000x1000bb')}" alt="">`;
    s.remove(); delete window[cb];
  };
  s.src = `https://itunes.apple.com/search?term=${encodeURIComponent(D.itunesTerm||(D.artist+' '+D.album))}`
        + `&entity=album&media=music&limit=1&country=tw&callback=${cb}`;
  s.onerror = ()=>{ s.remove(); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
